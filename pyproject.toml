[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weathercraft"
version = "0.1.0"
description = "Discrete autoregressive weather forecasting and post-training"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["weathercraft*", "baseline*"]

[tool.setuptools.package-data]
"weathercraft.posttrain.grpo" = ["*.json"]

[tool.black]
line-length = 100
