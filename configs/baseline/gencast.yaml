{
  "model": "gencast",
  "seed": 42,
  "epochs": 50,
  "global_batch": 32,
  "devices": 8,
  "learning_rate": 0.001,
  "warmup_updates": 1000,
  "weight_decay": 0.1,
  "mesh_size": 5,
  "latent_size": 512,
  "transformer_layers": 16,
  "attention_heads": 4,
  "attention_k_hop": 32,
  "ffw_hidden": 2048,
  "attention_type": "triblockdiag_mha",
  "rematerialize": true,
  "precision": "bfloat16",
  "history_days": 2,
  "step_hours": 24,
  "ensemble_members": 8,
  "leads": [
    1,
    3,
    5,
    10,
    15
  ],
  "sampler_steps": 20,
  "split": {
    "train": [
      "1979-01-01",
      "2018-12-31"
    ],
    "valid": [
      "2019-01-01",
      "2019-12-31"
    ],
    "test": [
      "2020-01-01",
      "2022-12-31"
    ]
  },
  "data_root": "${ERA5_ROOT}",
  "upstream_commit": "bf9785fa72a0f5c3eec5b516d5ea154ab07f12ab",
  "normalization": "${PROJECT_ROOT}/configs/normalization.json",
  "residual_statistics": "${PROJECT_ROOT}/configs/gencast_residual_statistics.json",
  "output_dir": "${PROJECT_ROOT}/runs/baseline/gencast"
}
