epochs: 100
seed: 42
lr: 0.0001
weight_decay: 0.0001
batch_per_rank: 2
world_size: 8
precision: fp32
initialization: random
train_years:
- 1979
- 2018
validation_years:
- 2019
- 2019
checkpoint_selection: minimum fixed-noise 2019 MeanFlow validation loss
training_pairs: 14609
distributed_sampler: shuffle, drop one pair per epoch to equalize ranks; permutation
  changes by epoch
forecast_hours: 24
meanflow:
  flow_ratio: 0.5
  time_mu: -0.4
  time_sigma: 1.0
data_config: ${PROJECT_ROOT}/configs/data.yaml
output_dir: ${PROJECT_ROOT}/runs/baseline/tyche
