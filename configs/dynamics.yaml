experiment: dynamics
modality: atmosphere
seed: 42
data_config: ${PROJECT_ROOT}/configs/data.yaml
tokenizer_config: ${PROJECT_ROOT}/configs/tokenizer.yaml
tokenizer_checkpoint: ${PROJECT_ROOT}/checkpoints/tokenizer.pt
checkpoint: ${PROJECT_ROOT}/checkpoints/dynamics.pt
token_cache: ${PROJECT_ROOT}/cache/tokens
model:
  depth: 16
  model_dim: 1536
  num_heads: 24
  mlp_ratio: 4.0
  dropout: 0.0
  drop_path: 0.1
  label_smoothing: 0.0
  activation_checkpointing: true
train:
  epochs: 50
  batch_size: 8
  global_batch: 64
  grad_accumulation: 1
  workers: 4
  learning_rate: 0.0002
  min_learning_rate: 0.00002
  warmup_steps: 500
  weight_decay: 0.05
  grad_clip: 1.0
  amp: bf16
  output_dir: ${PROJECT_ROOT}/runs/dynamics
evaluation:
  leads: [1, 3, 5, 10, 15]
  ensemble_members: 8
  temperature: 1.0
  top_k: 0
  kv_cache: true
  seed: 20261025
  output_dir: ${PROJECT_ROOT}/runs/evaluation
